[project]
name = "orca"
version = "0.1.0"
description = "ORCA — Marine EcOsystem Reasoning with Collaborative Agents (SIH 2026)"

requires-python = ">=3.11,<3.15"
dependencies = [
  # --- web / api ---
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "httpx>=0.28",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.20",
  # --- science ---
  "numpy>=2.1",
  "scipy>=1.14",
  "xarray>=2024.10",
  "netCDF4>=1.7",
  "shapely>=2.0",
  "pyproj>=3.7",
  "h3>=4.1",
  "scikit-image>=0.24",
  "pillow>=11.0",
  "matplotlib>=3.9",
  "cmocean>=4.0",
  # --- persistence / jobs ---
  "aiosqlite>=0.20",
  "apscheduler>=3.10,<4",
  # --- feeds / formats ---
  "feedparser>=6.0",
  "lxml>=5.3",
  "defusedxml>=0.7",
  # --- orbits ---
  "sgp4>=2.23",
  # --- operational external adapters ---
  "websockets>=14.0",
  "copernicusmarine>=2.4",
  # --- agents ---
  "langgraph>=0.2.50",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-core>=0.3",
]

[project.optional-dependencies]
postgis = ["asyncpg>=0.30"]
observability = ["langfuse>=2.53"]
heavy-ingest = ["earthaccess>=0.12", "rasterio>=1.4", "rioxarray>=0.18"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.22", "ruff>=0.8", "anyio>=4.6", "openpyxl>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orca"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
