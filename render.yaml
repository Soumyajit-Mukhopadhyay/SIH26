services:
  - type: web
    name: orca-backend
    env: python
    buildCommand: pip install -e backend
    startCommand: uvicorn orca.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ORCA_ENV
        value: prod
      - key: ORCA_DB_DRIVER
        value: sqlite
